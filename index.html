<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF 合併工具 (4合1)</title>
    <!-- 引入 pdf-lib 函式庫 -->
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 30px; text-align: center; background-color: #f5f7fa; color: #333; }
        .container { max-width: 600px; margin: 0 auto; background: white; border: 1px solid #ddd; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h2 { margin-top: 0; color: #2c3e50; }
        .file-upload-wrapper { margin: 25px 0; padding: 20px; border: 2px dashed #bdc3c7; border-radius: 8px; background-color: #ecf0f1; }
        input[type="file"] { font-size: 16px; }
        button { padding: 12px 24px; font-size: 16px; cursor: pointer; background-color: #3498db; color: white; border: none; border-radius: 6px; transition: background-color 0.3s; font-weight: bold; }
        button:hover { background-color: #2980b9; }
        #status { margin-top: 20px; font-weight: bold; font-size: 15px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>🖨️ PDF 4合1 網頁版合併工具</h2>
        <p>不需透過後端，純前端處理！系統會自動識別滿版 A4 標籤檔，精準裁切出左上角後統一等比放大合併。</p>
        
        <div class="file-upload-wrapper">
            <input type="file" id="fileInput" multiple accept=".pdf">
        </div>
        
        <button onclick="mergePDFs()">開始合併並匯出</button>
        <div id="status"></div>
    </div>

    <script>
        async function mergePDFs() {
            const fileInput = document.getElementById('fileInput');
            const statusDiv = document.getElementById('status');
            
            if (fileInput.files.length === 0) {
                statusDiv.textContent = '⚠️ 請先選擇 PDF 檔案！';
                statusDiv.style.color = '#e74c3c';
                return;
            }
            
            statusDiv.textContent = '⏳ 處理中，請稍候...';
            statusDiv.style.color = '#f39c12';

            try {
                const { PDFDocument } = PDFLib;
                const mergedPdf = await PDFDocument.create();
                
                // 定義 A4 紙張大小 (單位：points)
                const a4Width = 595.28;
                const a4Height = 841.89;
                
                // 每個象限的大小 (A4 的四分之一)
                const quadWidth = a4Width / 2;
                const quadHeight = a4Height / 2;

                const files = Array.from(fileInput.files);
                
                for (let i = 0; i < files.length; i += 4) {
                    const page = mergedPdf.addPage([a4Width, a4Height]);
                    const batch = files.slice(i, i + 4);
                    
                    const positions = [
                        { x: 0, y: quadHeight },             // 左上
                        { x: quadWidth, y: quadHeight },     // 右上
                        { x: 0, y: 0 },                      // 左下
                        { x: quadWidth, y: 0 }               // 右下
                    ];

                    for (let j = 0; j < batch.length; j++) {
                        const file = batch[j];
                        const arrayBuffer = await file.arrayBuffer();
                        const srcDoc = await PDFDocument.load(arrayBuffer);
                        
                        const srcPage = srcDoc.getPages()[0];
                        const { width, height } = srcPage.getSize();

                        let embeddedPage;

                        // =========================================================
                        // 🚀 精準判定門檻：
                        // 滿版 A4 (1240x1754 像素) 在 PDF 點數中約為 595x842 pt
                        // 單張標籤 (619x873 像素) 在 PDF 點數中約為 297x419 pt
                        // 因此條件設為 width > 450 或 height > 600
                        // =========================================================
                        if (width > 450 || height > 600) {
                            // 建立一個僅包含「左上角四分之一」的暫存 PDF (約 297x421 pt)
                            const croppedDoc = await PDFDocument.create();
                            const croppedPage = croppedDoc.addPage([width / 2, height / 2]);
                            
                            const [embedSrc] = await croppedDoc.embedPdf(srcDoc, [0]);
                            
                            // 將原始大 PDF 往左下偏移，只將左上角的內容印進新頁面
                            croppedPage.drawPage(embedSrc, {
                                x: 0,
                                y: -height / 2,
                                width: width,
                                height: height
                            });

                            // 匯出並載入這個裁切好的「小標籤 PDF」
                            const croppedBytes = await croppedDoc.save();
                            const cleanDoc = await PDFDocument.load(croppedBytes);
                            [embeddedPage] = await mergedPdf.embedPdf(cleanDoc, [0]);
                        } else {
                            // 已經是小標籤的 PDF (如 619x873) 直接載入
                            [embeddedPage] = await mergedPdf.embedPdf(srcDoc, [0]);
                        }
                        
                        // 計算等比縮放塞入象限 (預留 5% 邊距)
                        const scaleX = quadWidth / embeddedPage.width;
                        const scaleY = quadHeight / embeddedPage.height;
                        const scale = Math.min(scaleX, scaleY) * 0.95; 
                        
                        const scaledWidth = embeddedPage.width * scale;
                        const scaledHeight = embeddedPage.height * scale;
                        
                        // 置中繪製
                        const tx = positions[j].x + (quadWidth - scaledWidth) / 2;
                        const ty = positions[j].y + (quadHeight - scaledHeight) / 2;
                        
                        page.drawPage(embeddedPage, {
                            x: tx,
                            y: ty,
                            width: scaledWidth,
                            height: scaledHeight
                        });
                    }
                }

                const pdfBytes = await mergedPdf.save();
                
                const blob = new Blob([pdfBytes], { type: 'application/pdf' });
                const url = URL.createObjectURL(blob);
                
                const a = document.createElement('a');
                a.href = url;
                a.download = 'Merged_4in1_Labels.pdf';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                
                statusDiv.textContent = '✅ 合併完成！已自動下載檔案。';
                statusDiv.style.color = '#27ae60';
            } catch (error) {
                console.error(error);
                statusDiv.textContent = '❌ 發生錯誤：' + error.message;
                statusDiv.style.color = '#c0392b';
            }
        }
    </script>
</body>
</html>
